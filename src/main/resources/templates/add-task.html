<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Add a New Task</h1>
    <p class="intro">Use the form below to create a new task.</p>

    <form th:action="@{/addTask}" th:object="${task}" method="post">
        <label for="id">ID</label>
        <input type="number" id="id" th:field="*id" required>

        <label for="title">Title</label>
        <input type="text" id="title" th:field="*title" required>

        <label for="description">Description</label>
        <input type="text" id="description" th:field="*description" required>

        <label for="dueDate">Due Date</label>
        <input type="date" id="dueDate" th:field="*dueDate" required>

        <label class="checkbox-row">
            <input type="checkbox" th:field="*completed">
            Completed
        </label>

        <button type="submit">Save Task</button>
    </form>
</div>
</body>
</html>
