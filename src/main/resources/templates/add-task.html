<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add a Task</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <h1>Add a New Task</h1>
    <a th:href="@{/}" class="btn secondary-btn">Back to Task List</a>
    <p class="intro">Use the form below to create a new task.</p>

    <form th:action="@{/addTask}" th:object="${task}" method="post">

        <label for="title">Title</label>
        <input type="text" id="title" th:field="*{title}" th:errorclass="input-error">
        <p class="error-message"
           th:if="${#fields.hasErrors('title')}"
           th:errors="*{title}"></p>

        <label for="description">Description:</label>
        <input type="text" id="description" th:field="*{description}" th:errorclass="input-error">
        <p class="error-message"
           th:if="${#fields.hasErrors('description')}"
           th:errors="*{description}"></p>

        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate" th:field="*{dueDate}" th:errorclass="input-error">
        <p class="error-message"
           th:if="${#fields.hasErrors('dueDate')}"
           th:errors="*{dueDate}"></p>

        <label class="checkbox-row">
            <input type="checkbox" th:field="*{completed}">
            Completed
        </label>

        <button type="submit">Save Task</button>
    </form>
</div>
</body>
</html>
